<style>

*{
margin:0;
padding:0;

body{
background:#160000;
font-family:'Poppins',sans-serif;
padding:20px;
color:white;
overflow-x:auto;
}

/* ================= CONTAINER ================= */

.container{
max-width:1700px;
margin:auto;

display:flex;
flex-direction:row;

align-items:flex-start;
justify-content:center;

gap:25px;
}

/* ================= PREVIEW ================= */

.preview-wrap{
width:100%;
overflow:auto;
display:flex;
justify-content:center;
padding-bottom:10px;
}

.preview{

width:1254px;
height:1254px;

min-width:1254px;
min-height:1254px;

position:relative;
overflow:hidden;
flex-shrink:0;

/* DEFAULT TEMPLATE */
background-image:url('https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/Layout%20Syair%20TVTOTO.png');

background-size:cover;
background-position:center;
background-repeat:no-repeat;

}

/* ================= LAYER ================= */

.market,
.shio-circle{
z-index:10;
}

.date-box,
.shio-name,
.colok,
.bbfs,
.angka,
.syair{
z-index:20;
}

/* ================= DATE ================= */

.date-box{
position:absolute;
top:185px;
left:50%;
transform:translateX(-50%);

width:310px;
height:70px;

display:flex;
align-items:center;
justify-content:center;

font-size:38px;
font-family:'Cinzel',serif;
font-weight:700;

color:#ffd86b;

letter-spacing:1px;

text-shadow:0 2px 5px rgba(0,0,0,.7);
}

/* ================= MARKET ================= */

.market{
position:absolute;
top:275px;
left:50%;
transform:translateX(-50%);

width:100%;

display:flex;
justify-content:center;
align-items:center;
}

.market img{
max-width:420px;
max-height:90px;
object-fit:contain;

filter:drop-shadow(0 4px 5px rgba(0,0,0,.6));
}

/* ================= SHIO ================= */

.shio-circle{
position:absolute;
top:433px;
left:450px;

width:345px;
height:345px;

border-radius:50%;
overflow:hidden;
}

.shio-circle img{
width:100%;
height:100%;
object-fit:cover;
}

.shio-name{
position:absolute;
top:825px;
left:50%;
transform:translateX(-50%);

width:420px;
height:80px;

display:flex;
align-items:center;
justify-content:center;

font-size:40px;
font-family:'Cinzel',serif;
font-weight:900;

color:#ffd86b;

letter-spacing:2px;

text-shadow:0 3px 5px rgba(0,0,0,.7);
}

/* ================= COLOK ================= */

.colok{
position:absolute;
top:558px;
left:60px;

width:280px;
height:260px;
}

.colok-content{
display:grid;
grid-template-columns:1fr 1fr;

row-gap:40px;

font-size:84px;
font-weight:900;

text-align:center;
color:white;

line-height:1;

text-shadow:0 4px 5px rgba(0,0,0,.7);
}

/* ================= BBFS ================= */

.bbfs{
position:absolute;
top:566px;
right:63px;

width:290px;
height:170px;
}

.box-content{
font-size:65px;
font-weight:900;

text-align:center;

color:white;

letter-spacing:1px;

text-shadow:0 4px 5px rgba(0,0,0,.7);
}

/* ================= ANGKA MAIN ================= */

.angka{
position:absolute;
top:830px;
right:55px;

width:300px;
height:120px;
}

.angka-content{
font-size:34px;
font-weight:700;

text-align:center;

color:white;

text-shadow:0 3px 5px rgba(0,0,0,.7);
}

/* ================= SYAIR ================= */

.syair{
position:absolute;
bottom:85px;
left:50%;
transform:translateX(-50%);

width:600px;
height:210px;

padding:20px;
}

.syair-text{
font-size:25px;
font-weight:700;
line-height:1.45;

text-align:center;
color:white;

text-shadow:0 3px 5px rgba(0,0,0,.7);

height:100%;

display:flex;
align-items:center;
justify-content:center;

word-wrap:break-word;
overflow-wrap:break-word;
}


/* ================= BRAND SWITCHER ================= */

.brand-switcher{
display:flex;
gap:12px;
margin-bottom:20px;
}

.brand-btn{
flex:1;
height:70px;
padding:8px;
margin:0;
background:#5a0000;
border:2px solid #8d5f00;
border-radius:12px;
cursor:pointer;
transition:.3s;
}

.brand-btn img{
width:100%;
height:100%;
object-fit:contain;
}

.brand-btn.active{
border:2px solid #ffd86b;
box-shadow:0 0 15px rgba(255,216,107,.5);
background:#7a0000;
}



/* ================= BRAND LOGO PREVIEW ================= */

.brand-logo-preview{
position:absolute;
top:25px;
left:50%;
transform:translateX(-50%);
width:420px;
height:120px;
display:flex;
align-items:center;
justify-content:center;
z-index:30;
}

.brand-logo-preview img{
max-width:100%;
max-height:100%;
object-fit:contain;
filter:drop-shadow(0 4px 8px rgba(0,0,0,.6));
}


/* ================= PANEL ================= */

.panel{
width:350px;
min-width:350px;

position:sticky;
top:20px;

background:#460000;

border:3px solid #ffb300;
border-radius:20px;

padding:25px;

box-shadow:0 0 25px rgba(255,179,0,.25);
}

.panel h2{
text-align:center;

font-family:'Cinzel',serif;
font-size:36px;

margin-bottom:20px;

color:#ffd86b;
}

.input-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;

font-weight:700;
color:#ffd86b;
}

select{
width:100%;

padding:16px;

border:none;
border-radius:12px;

background:#720000;
color:white;

font-size:16px;
outline:none;
}

button{
width:100%;

padding:16px;

border:none;
border-radius:12px;

margin-top:12px;

cursor:pointer;

font-size:16px;
font-weight:700;

transition:.3s;

background:linear-gradient(to bottom,#ffd86b,#ff9800);

color:#550000;
}

button:hover{
transform:scale(1.02);
}

/* ================= MOBILE ================= */

@media(max-width:1300px){

.preview{
transform:scale(.75);
transform-origin:top center;
margin-bottom:-280px;
}

}

@media(max-width:1000px){

.preview{
transform:scale(.55);
margin-bottom:-500px;
}

}

@media(max-width:700px){

.preview{
transform:scale(.42);
margin-bottom:-700px;
}

}

@media(max-width:1400px){

.container{

.panel{

top:auto;

.shio-circle{

overflow:hidden;
border:8px solid #d4af37;
box-shadow:
0 0 20px rgba(255,215,0,.6),

}

}

</style>

/* ================= DATE ================= */

function updateDate(){

const now=new Date();

const bulan=[
"JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI",
"JULI","AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"
];

const tanggal=
now.getDate()+" "+
bulan[now.getMonth()]+" "+
now.getFullYear();

document.getElementById("todayDate").innerText=tanggal;

}

/* ================= RANDOM ================= */

function randomNumber(length){

let result='';

for(let i=0;i<length;i++){

result += Math.floor(Math.random()*10);

}

return result;

}

function randomColok(){

let arr=[];

while(arr.length<4){

let n=Math.floor(Math.random()*10);

if(!arr.includes(n)){

arr.push(n);

}

}

return arr;

}

/* ================= GENERATE ================= */

function generateAll(){

const market=document.getElementById("marketSelect").value;

const shioKeys=Object.keys(shioData);

const randomShio=
shioKeys[Math.floor(Math.random()*shioKeys.length)];

document.getElementById("shioSelect").value=randomShio;

document.getElementById("marketLogo").src=
marketLogoData[market];

document.getElementById("shioName").innerText=
randomShio;

document.getElementById("shioImage").src=
shioData[randomShio].img;

document.getElementById("bbfsBox").innerText=
randomNumber(7);

const angka=randomColok();

document.getElementById("colokBox").innerHTML=`
<span>${angka[0]}</span>
<span>${angka[1]}</span>
<span>${angka[2]}</span>
<span>${angka[3]}</span>
`;

const angkaMain=[];

while(angkaMain.length<5){

let n=Math.floor(Math.random()*10);

if(!angkaMain.includes(n)){

angkaMain.push(n);

}

}

document.getElementById("angkaMain").innerText=
angkaMain.join(" - ");

const syairList=shioData[randomShio].syair;

const syairRandom=
syairList[Math.floor(Math.random()*syairList.length)];

document.getElementById("syairText").innerText=
syairRandom;

}

/* ================= DOWNLOAD ================= */

async function downloadImage(){

const preview=document.getElementById("capture");

const oldTransform=preview.style.transform;
const oldMargin=preview.style.marginBottom;

preview.style.transform="scale(1)";
preview.style.marginBottom="0px";

await new Promise(resolve=>setTimeout(resolve,300));

try{

const canvas=await html2canvas(preview,{

useCORS:true,
allowTaint:false,
backgroundColor:null,
logging:false,

scale:2,

width:1254,
height:1254

});

preview.style.transform=oldTransform;
preview.style.marginBottom=oldMargin;

const shioName=
document.getElementById("shioName")
.innerText
.replace("SHIO ","Shio ");

const now=new Date();

const bulan=[
"Januari",
"Februari",
"Maret",
"April",
"Mei",
"Juni",
"Juli",
"Agustus",
"September",
"Oktober",
"November",
"Desember"
];

const tanggal=
now.getDate()+" "+
bulan[now.getMonth()];

const fileName=
`${shioName} ${tanggal}.png`;

const link=document.createElement("a");

link.download=fileName;

link.href=canvas.toDataURL("image/png");

link.click();

}catch(err){

alert("Gagal download gambar");

console.log(err);

}

}
